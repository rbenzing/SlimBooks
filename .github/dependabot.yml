# Dependabot
#
# The 2.5.0 → 3.0.0 cycle cleared 21 advisories in one sitting: three critical,
# ten high. They accumulated because nothing was watching — a self-hosted
# application's dependencies age silently, and the first sign is a scanner
# report on somebody else's install.
#
# Weekly rather than daily: this is a project maintained by one person, and a
# pull request nobody has time to read is not a security control.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One pull request per group rather than per package. Twenty individual
    # bumps is how dependency updates stop getting reviewed at all.
    groups:
      # Anything with a published advisory travels on its own, so a security
      # fix is never queued behind a routine major.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Majors are deliberately not grouped: vite 8, vitest 5, express 5 and
    # react-router 7 each needed real code changes, and each deserves its own
    # pull request and its own two-engine CI run.
    labels: [dependencies]

  # The workflows pin actions by major tag, which still moves. This keeps the
  # supply chain of the build itself watched, not only the application's.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
