# Release
#
# Fires on a pushed `v*` tag and publishes a GitHub release for it.
#
# Two things this deliberately does before publishing anything:
#
#   1. Refuses a tag that disagrees with package.json. A `v1.2.0` tag on a tree
#      whose package.json says 1.1.0 produces a release whose contents report a
#      different version than its name — and the server reads its version from
#      package.json, so the running app would contradict the release it came
#      from.
#
#   2. Runs the full gate. A tag is not a promise that someone ran the tests
#      before pushing it, so the release job proves it rather than assuming it.
#
# Publishing is a separate job that depends on the first, so a failure at any
# earlier step leaves no release behind.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  # Needed to create the release. Nothing here needs any other scope.
  contents: write
  # Provenance attestation for the published tarball: id-token to sign, and
  # attestations to record it. Without them an operator downloading the release
  # has only our word that it was built from this tag by this workflow.
  id-token: write
  attestations: write

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          # Full history and tags, so the annotated tag's own message can be
          # read back for the release notes.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check the tag matches package.json
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}."
            echo "::error::Bump package.json to ${TAG_VERSION}, or retag as v${PACKAGE_VERSION}."
            exit 1
          fi

          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${PACKAGE_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The frontend bundle and the compiled server, ready to drop onto a host
      # alongside an `npm ci --omit=dev`. The lockfile travels with it so that
      # install resolves the same dependency tree this release was tested on.
      #
      # `dist` covers both halves: the build emits dist/client (the SPA) and
      # dist/server (the compiled backend). It used to also list server/dist,
      # which 2.0.0 removed — the two dist directories collided, and the paths
      # resolved differently under tsx than compiled.
      - name: Package the build
        run: |
          tar -czf "slimbooks-${{ steps.version.outputs.version }}.tar.gz" \
            dist \
            package.json \
            package-lock.json \
            .env.example

      # Signs a statement that this exact tarball was produced by this workflow,
      # from this commit, and records it against the repository. `gh attestation
      # verify slimbooks-X.Y.Z.tar.gz --repo <owner>/SlimBooks` checks it, which
      # is what lets somebody who did not build it establish where it came from.
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: slimbooks-*.tar.gz

      - name: Keep the package for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: slimbooks-*.tar.gz
          retention-days: 7


  # The same two-engine job CI runs. Without it a release is published on the
  # strength of `npm test` alone — and the MySQL suites skip themselves when no
  # server is configured, so that run is green having never touched the backend
  # half the deployment guide recommends for any ephemeral host.
  database:
    name: Server suite on ${{ matrix.engine.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        engine:
          - name: MySQL 8.0
            image: mysql:8.0
          - name: MariaDB 10.11
            image: mariadb:10.11

    services:
      database:
        image: ${{ matrix.engine.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: slimbooks_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: slimbooks_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/slimbooks_test

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A suite that skips itself passes. This asserts the MySQL half actually
      # ran, so the job cannot go green having tested nothing.
      - name: Confirm the MySQL suite is not skipped
        run: |
          npx vitest run server/database/twoDriver.test.ts server/database/MySQLDatabase.test.ts \
            --reporter=json --outputFile=/tmp/result.json
          node -e '
            const report = require("/tmp/result.json");
            const skipped = report.numPendingTests ?? 0;
            const total = report.numTotalTests ?? 0;
            if (total === 0 || skipped > 0) {
              console.error(`MySQL suite did not run: ${total} total, ${skipped} skipped`);
              process.exit(1);
            }
            console.log(`MySQL suite ran ${total} test(s) against ${process.env.TEST_MYSQL_URL}`);
          '

      - name: Server suite against ${{ matrix.engine.name }}
        run: npx vitest run server/

  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [verify, database]

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retrieve the package
        uses: actions/download-artifact@v8
        with:
          name: release-build

      # An annotated tag carries its own message; that is the release note the
      # person cutting the release actually wrote. Anything else is generated
      # from commit subjects, which is a worse description of what changed.
      - name: Assemble the release notes
        run: |
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}." > RELEASE_NOTES.md
          fi

          cat RELEASE_NOTES.md

      # `gh` is preinstalled on GitHub runners, so this needs no third-party
      # action. `--verify-tag` refuses to invent a tag that does not exist.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Slimbooks ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            slimbooks-*.tar.gz
